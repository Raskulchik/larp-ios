[package]
name = "larp-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "larp-daemon"
path = "src/main.rs"

[dependencies]
larp-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
md5 = "0.7"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"