[package]
name = "larp-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "larp-daemon"
path = "src/main.rs"

[dependencies]
larp-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
md5 = "0.7"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
urlencoding = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rsa = "0.9"
rand = "0.8"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"